[project]
name = "liqdash"
version = "0.1.0"
description = "Local Binance liquidation dashboard fed by t.me/BinanceLiquidations"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
liq-import = "liqdash.cli:import_main"
liq-login = "liqdash.cli:login_main"
liq-sync = "liqdash.cli:sync_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liqdash"]
